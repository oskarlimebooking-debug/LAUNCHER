notes: 'Android 6 (API 23) ART uses hybrid execution (interpreter + JIT) by default,

  so unguarded API calls fail at runtime when the specific code path is hit,

  not at install time. However, platform-signed system builds may behave

  differently depending on the ROM''s compiler filter.

