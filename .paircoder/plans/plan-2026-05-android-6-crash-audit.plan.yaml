sprint: 2
description: "Systematic audit of retrofit-launcher for Android 6 (API 23) crash risks,\n\
  followed by targeted fixes. The app runs fine on newer devices but may crash\non\
  \ API 23 head units due to unguarded API 26+ calls, installation-time\nclass verification,\
  \ or desugaring gaps in release builds.\n\nKey finding from initial exploration:\n\
  - Embedding.kt:70-71 calls ActivityOptions.setLaunchDisplayId() (API 26)\n  without\
  \ any Build.VERSION.SDK_INT guard. NoSuchMethodError on API 23.\n- Release builds\
  \ with minifyEnabled may strip desugared JDK classes.\n- No crash barriers exist\
  \ in the API 23 code path to prevent silent\n  failures from becoming user-visible\
  \ crashes.\n"
